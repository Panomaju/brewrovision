services:
    app:
        build: .
        restart: unless-stopped
        environment:
            DATABASE_PATH: /data/brewrovision.db
            PORT: 3000
        volumes:
            - db-data:/data
        ports:
            # Bind to loopback only — put nginx/Caddy in front of this and let
            # the reverse proxy terminate TLS.
            - "127.0.0.1:3000:3000"

volumes:
    db-data:
